<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova avaliação</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body class="fundo-avaliacao">
    <div th:replace="~{fragments :: topo}"></div>

    <h2>Nova avaliação</h2>
    
    <div class="form-container">
        <form th:action="@{/avaliacoes}" th:object="${avaliacao}" method="post">
            <div class="campo">
                <label for="titulo">Título:</label>
                <input type="text" th:field="*{titulo}" id="titulo">
                <span class="erro-msg" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
            </div>

            <div class="campo">
                <label for="descricao">Descrição:</label>
                <textarea th:field="*{descricao}" id="descricao" rows="4"></textarea>
            </div>

            <div class="campo">
                <label for="dataAplicacao">Data:</label>
                <input type="date" th:field="*{dataAplicacao}" id="dataAplicacao">
                <span class="erro-msg" th:if="${#fields.hasErrors('dataAplicacao')}" th:errors="*{dataAplicacao}"></span>
            </div>

            <div class="campo">
                <label for="horaInicio">Início:</label>
                <input type="time" th:field="*{horaInicio}" id="horaInicio">
                <span class="erro-msg" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></span>
            </div>

            <div class="campo">
                <label for="horaFim">Fim:</label>
                <input type="time" th:field="*{horaFim}" id="horaFim">
                <span class="erro-msg" th:if="${#fields.hasErrors('horaFim')}" th:errors="*{horaFim}"></span>
            </div>

            <div class="form-actions">
                <input type="submit" value="Salvar" class="btn">
                <a th:href="@{/avaliacoes}" class="btn btn-perigo">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
