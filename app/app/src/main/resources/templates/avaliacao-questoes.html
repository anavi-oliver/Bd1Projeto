<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Montar avaliação</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body class="fundo-avaliacao">
    <div th:replace="~{fragments :: topo}"></div>

    <h2>Montar avaliação</h2>
    <h3 style="text-align: center;">
        <strong th:text="${avaliacao.titulo}"></strong>
        (<span th:text="${#temporals.format(avaliacao.dataAplicacao, 'dd/MM/yyyy')}"></span>)
    </h3>

    <p th:if="${bloqueada}" class="erro-msg" style="text-align: center; font-size: 1.1em;">
        Esta avaliação já tem respostas, então as questões não podem mais ser alteradas.
    </p>

    <form th:action="@{/avaliacoes/{id}/questoes(id=${avaliacao.idAvaliacao})}" method="post">
        <table>
            <thead>
                <tr><th>Usar</th><th>#</th><th>Enunciado</th><th>Tipo</th><th>Tema</th></tr>
            </thead>
            <tbody>
                <tr th:each="q : ${questoes}">
                    <td style="text-align: center;">
                        <input type="checkbox" name="idsQuestoes"
                               th:value="${q.idQuestao}"
                               th:checked="${#lists.contains(selecionadas, q.idQuestao)}"
                               th:disabled="${bloqueada}">
                    </td>
                    <td th:text="${q.idQuestao}"></td>
                    <td th:text="${q.enunciado}"></td>
                    <td th:text="${q.tipo}"></td>
                    <td th:text="${q.nomeTema}"></td>
                </tr>
            </tbody>
        </table>
        
        <div class="form-actions">
            <input type="submit" value="Salvar questões" class="btn" th:disabled="${bloqueada}">
            <a th:href="@{/avaliacoes}" class="btn btn-perigo">Voltar</a>
        </div>
    </form>
</body>
</html>
