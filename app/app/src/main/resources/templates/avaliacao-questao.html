<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Montar avaliação</title>
</head>
<body>
    <p><a th:href="@{/questoes}">Questões</a> | <a th:href="@{/avaliacoes}">Avaliações</a> | <a th:href="@{/logout}">Sair</a></p>
    <h2>Montar avaliação</h2>
    <p><strong th:text="${avaliacao.titulo}"></strong>
       (<span th:text="${#temporals.format(avaliacao.dataAplicacao, 'dd/MM/yyyy')}"></span>)</p>

    <p th:if="${bloqueada}" style="color: red;">
        Esta avaliação já tem respostas, então as questões não podem mais ser alteradas.
    </p>

    <form th:action="@{/avaliacoes/{id}/questoes(id=${avaliacao.idAvaliacao})}" method="post">
        <table border="1">
            <thead>
                <tr><th>Usar</th><th>#</th><th>Enunciado</th><th>Tipo</th><th>Tema</th></tr>
            </thead>
            <tbody>
                <tr th:each="q : ${questoes}">
                    <td>
                        <input type="checkbox" name="idsQuestoes"
                               th:value="${q.idQuestao}"
                               th:checked="${#lists.contains(selecionadas, q.idQuestao)}"
                               th:disabled="${bloqueada}">
                    </td>
                    <td th:text="${q.idQuestao}"></td>
                    <td th:text="${q.enunciado}"></td>
                    <td th:text="${q.tipo}"></td>
                    <td th:text="${q.nomeTema}"></td>
                </tr>
            </tbody>
        </table>
        <br>
        <input type="submit" value="Salvar questões" th:disabled="${bloqueada}">
        <a th:href="@{/avaliacoes}">Voltar</a>
    </form>
</body>
</html>
