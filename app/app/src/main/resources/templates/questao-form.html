<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova questão</title>
</head>
<body>
    <p>Olá, <span th:text="${session.usuarioLogado.nome}"></span> | <a th:href="@{/logout}">Sair</a></p>
    <h2>Nova questão</h2>
    <form th:action="@{/questoes}" th:object="${questao}" method="post">
        <label for="enunciado">Enunciado:</label><br>
        <textarea th:field="*{enunciado}" id="enunciado" rows="3" cols="60"></textarea>
        <span th:if="${#fields.hasErrors('enunciado')}" th:errors="*{enunciado}"></span>
        <br><br>

        <label for="tipo">Tipo:</label>
        <select th:field="*{tipo}" id="tipo">
            <option value="">-- escolha --</option>
            <option value="ESCALA">Escala (1 a 5)</option>
            <option value="TEXTO">Texto livre</option>
        </select>
        <span th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
        <br><br>

        <label for="idTema">Tema:</label>
        <select th:field="*{idTema}" id="idTema">
            <option value="0">-- escolha --</option>
            <option th:each="t : ${temas}" th:value="${t.idTema}" th:text="${t.nome}"></option>
        </select>
        <span th:if="${#fields.hasErrors('idTema')}" th:errors="*{idTema}"></span>
        <br><br>

        <input type="submit" value="Salvar">
        <a th:href="@{/questoes}">Cancelar</a>
    </form>
</body>
</html>
