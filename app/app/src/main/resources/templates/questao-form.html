<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova Questão</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <div th:replace="~{fragments :: topo}"></div>

    <h2>Nova Questão</h2>

    <div class="form-container">
        <form th:action="@{/questoes}" th:object="${questao}" method="post">

            <div class="campo">
                <label for="enunciado">Enunciado:</label>
                <textarea th:field="*{enunciado}" id="enunciado" rows="4"></textarea>
                <span class="erro-msg" th:if="${#fields.hasErrors('enunciado')}" th:errors="*{enunciado}"></span>
            </div>

            <div class="campo">
                <label for="tipo">Tipo:</label>
                <select th:field="*{tipo}" id="tipo">
                    <option value="">-- escolha --</option>
                    <option value="ESCALA">Escala (1 a 5)</option>
                    <option value="TEXTO">Texto livre</option>
                </select>
                <span class="erro-msg" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
            </div>

            <div class="campo">
                <label for="idTema">Tema:</label>
                <select th:field="*{idTema}" id="idTema">
                    <option value="0">-- escolha --</option>
                    <option th:each="t : ${temas}" th:value="${t.idTema}" th:text="${t.nome}"></option>
                </select>
                <span class="erro-msg" th:if="${#fields.hasErrors('idTema')}" th:errors="*{idTema}"></span>
            </div>

            <div class="form-actions">
                <input type="submit" value="Salvar Questão" class="btn">
                <a th:href="@{/questoes}" class="btn btn-perigo">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
