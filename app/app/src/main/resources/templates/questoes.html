<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Questões</title>

    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <div th:replace="~{fragments :: topo}"></div>

    <h2>Minhas Questões</h2>
    
    <table style="border: 3px solid #b152fe; box-shadow: 0 0 10px #2be2d3d8, 0 0 20px #2be2d3;">
        <thead>
            <tr>
                <th>#</th>
                <th>Enunciado</th>
                <th>Tipo</th>
                <th>Tema</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="q : ${questoes}">     
                <td th:text="${q.idQuestao}"></td>
                <td th:text="${q.enunciado}"></td>
                <td th:text="${q.tipo}"></td>
                <td th:text="${q.nomeTema}"></td>
            </tr>
        </tbody>
    </table>
    
    <div class="form-actions">
        <a th:href="@{/questoes/nova}" class="btn">+ Criar nova questão</a>
    </div>
</body>
</html>
