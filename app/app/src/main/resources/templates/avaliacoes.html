<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Avaliações</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body class="fundo-avaliacao">
    <div th:replace="~{fragments :: topo}"></div>

    <h2> Avaliações </h2>
    
    <table style="border: 3px solid #b152fe; box-shadow: 0 0 10px #2be2d3d8, 0 0 20px #2be2d3;">
        <thead>
            <tr>
                <th>#</th><th>Título</th><th>Descrição</th><th>Data</th><th>Início</th><th>Fim</th>
                <th>Questões</th><th>Quem responde</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${avaliacoes}">
                <td th:text="${a.idAvaliacao}"></td>
                <td th:text="${a.titulo}"></td>
                <td th:text="${a.descricao}"></td>
                <td th:text="${#temporals.format(a.dataAplicacao, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(a.horaInicio, 'HH:mm')}"></td>
                <td th:text="${#temporals.format(a.horaFim, 'HH:mm')}"></td>
                <td style="text-align: center;"><a th:href="@{/avaliacoes/{id}/questoes(id=${a.idAvaliacao})}" class="btn">Montar</a></td>
                <td style="text-align: center;"><a th:href="@{/avaliacoes/{id}/usuarios(id=${a.idAvaliacao})}" class="btn">Designar</a></td>
            </tr>
        </tbody>
    </table>
    
    <div class="form-actions">
        <a th:href="@{/avaliacoes/nova}" class="btn">+ Criar nova avaliação</a>
    </div>
</body>
</html>
